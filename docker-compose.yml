services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: billing_db
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - billing_mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./database/03_views_procedures.sql:/docker-entrypoint-initdb.d/03_views_procedures.sql:ro
      - ./database/04_roles_and_grants.sql:/docker-entrypoint-initdb.d/04_roles_and_grants.sql:ro
      - ./database/05_seed.sql:/docker-entrypoint-initdb.d/05_seed.sql:ro
      - ./database/07_phase4_migration.sql:/docker-entrypoint-initdb.d/06_phase4_migration.sql:ro
      - ./database/03_views_procedures.sql:/docker-entrypoint-initdb.d/07_views_procedures.sql:ro
      - ./database/04_roles_and_grants.sql:/docker-entrypoint-initdb.d/08_roles_and_grants.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: billing_db
      DB_CUSTOMER_USER: billing_customer
      DB_CUSTOMER_PASS: ${DB_CUSTOMER_PASS:?Set DB_CUSTOMER_PASS in .env}
      DB_CASHIER_USER: billing_cashier
      DB_CASHIER_PASS: ${DB_CASHIER_PASS:?Set DB_CASHIER_PASS in .env}
      DB_ADMIN_USER: billing_admin
      DB_ADMIN_PASS: ${DB_ADMIN_PASS:?Set DB_ADMIN_PASS in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      INVOICE_SIGNING_SECRET: ${INVOICE_SIGNING_SECRET:?Set INVOICE_SIGNING_SECRET in .env}
      UPI_ID: ${UPI_ID:-}
      SHOP_NAME: ${SHOP_NAME:-Billing System}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-}
      SHOP_GSTIN: ${SHOP_GSTIN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - billing_invoice_storage:/app/storage/invoices
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  billing_mysql_data:
  billing_invoice_storage:
